name: Bug report
description: Something in InboxOS isn't working as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For security problems, please follow SECURITY.md instead of opening an issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, and what you expected to see instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 1.0.0, or a commit hash
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where are you running it?
      options:
        - Deployed to Cloudflare
        - Locally with npm run dev
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 140 on macOS, Safari on iPhone (installed app)…
  - type: textarea
    id: health
    attributes:
      label: Admin → Health
      description: Anything Admin → Health reports as failing or a warning.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Browser console errors or `npx wrangler tail` output. Remove any personal data first.
      render: shell
