name: Feature request
description: Suggest an idea or an improvement for InboxOS.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation and why the current behavior falls short.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: dropdown
    id: use-case
    attributes:
      label: Which use case is this for?
      options:
        - Team
        - Agency
        - Support desk
        - Personal & family
        - Startup
        - Regulated / enterprise
        - Other
